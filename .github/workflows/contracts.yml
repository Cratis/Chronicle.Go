name: Generated contracts
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Install pinned Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.73.0
      - name: Verify generated contracts and inventory
        run: python3 scripts/generate-contracts.py --check
