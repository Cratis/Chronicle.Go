# Validate every explicitly listed Go module independently of local workspaces.
name: Go Build

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '19 5 * * 1'

permissions:
  contents: read

# A literal prefix prevents collisions when Publish calls this workflow.
concurrency:
  group: go-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  modules:
    name: Module layout and matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Test native module policy
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Enforce module allow-list and portable paths
        id: modules
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python3 -B .github/scripts/go_modules.py matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Verify public nested root dependencies (including unpublished previews)
        run: python3 -B .github/scripts/go_modules.py dependencies

  test:
    name: ${{ matrix.module.dir == '.' && format('Test ({0}, Go {1})', matrix.platform.os, matrix.platform.go) || format('Test ({0}, Go {1}) ({2})', matrix.platform.os, matrix.platform.go, matrix.module.dir) }}
    needs: modules
    defaults:
      run:
        working-directory: ${{ matrix.module.dir }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.matrix).module }}
        platform:
          - {os: ubuntu-latest, go: '1.26.x'}
          - {os: ubuntu-latest, go: '1.27.x'}
          - {os: macos-latest, go: '1.27.x'}
          - {os: windows-latest, go: '1.27.x'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.platform.go }}
          cache: ${{ hashFiles(format('{0}/go.sum', matrix.module.dir)) != '' }}
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify dependency checksums
        run: go mod verify
      - name: Compile all packages
        run: go build ./...
      - name: Vet all packages
        run: go vet ./...
      - name: Test all packages
        run: go test -count=1 -timeout=2m ./...

  race:
    name: ${{ matrix.module.dir == '.' && 'Race detector' || format('Race detector ({0})', matrix.module.dir) }}
    needs: modules
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.module.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: ${{ hashFiles(format('{0}/go.sum', matrix.module.dir)) != '' }}
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum
      - run: go test -race -count=1 -timeout=3m ./...

  lint:
    name: ${{ matrix.module.dir == '.' && 'Go lint and module hygiene' || format('Go lint and module hygiene ({0})', matrix.module.dir) }}
    needs: modules
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.module.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: ${{ hashFiles(format('{0}/go.sum', matrix.module.dir)) != '' }}
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum
      - name: Verify gofmt for this module only
        env:
          MODULE_DIR: ${{ matrix.module.dir }}
        run: python3 -B "$GITHUB_WORKSPACE/.github/scripts/go_modules.py" gofmt --root "$GITHUB_WORKSPACE" --module "$MODULE_DIR"
      - name: Check tidy manifests with the minimum supported Go (without edits)
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module.dir }}
          args: --timeout=3m

  vulnerabilities:
    name: ${{ matrix.module.dir == '.' && 'Go vulnerability check' || format('Go vulnerability check ({0})', matrix.module.dir) }}
    needs: modules
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.module.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: ${{ hashFiles(format('{0}/go.sum', matrix.module.dir)) != '' }}
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: actionlint -color

  contracts:
    needs: modules
    if: fromJSON(needs.modules.outputs.matrix).module[0].contracts
    uses: ./.github/workflows/contracts.yml

  integration:
    needs: modules
    if: fromJSON(needs.modules.outputs.matrix).module[0].kernelIntegration
    uses: ./.github/workflows/integration.yml

  gate:
    name: Go gate
    if: always()
    needs: [modules, test, race, lint, vulnerabilities, workflows, contracts, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all Go checks
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          jq -e 'all(.[]; . == "success")' <<< "$RESULTS"
