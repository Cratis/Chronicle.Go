name: Kernel integration
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    services:
      chronicle:
        image: cratis/chronicle:19.29.4-development
        ports:
          - 35000:35000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: Configure disposable compliance encryption certificate
        run: bash scripts/configure-compliance-integration.sh '${{ job.services.chronicle.id }}'
      - name: Wait for the kernel
        run: timeout 180 bash -c 'until curl -skf https://localhost:35000/health > /dev/null; do sleep 2; done'
      - name: Register, append and read back
        env:
          CHRONICLE_INTEGRATION_CONNECTION_STRING: chronicle://localhost:35000
        run: go test -tags=integration -count=1 -timeout=2m ./internal/integration ./chronicletest/...
      - name: Kernel diagnostics on failure
        if: failure()
        run: docker logs '${{ job.services.chronicle.id }}' --tail 150
